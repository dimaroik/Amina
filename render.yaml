# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploys are triggered by GitHub Actions (.github/workflows/ci-deploy.yml) after a PR is merged into main,
# so Render's own auto-deploy is switched off.
services:
  - type: web
    name: amina
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm run render-build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SEED_DEMO
        value: "true"
      - key: PUBLIC_URL
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: VIBER_BOT_TOKEN
        sync: false
      - key: VIBER_BOT_URI
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_TEMPLATE
        sync: false
      - key: MONOBANK_TOKEN
        sync: false
      - key: NOVA_POSHTA_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
