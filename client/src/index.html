<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <title>Amina — інтернет-магазин одягу</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Amina — інтернет-магазин одягу. Новинки щотижня, доставка Новою поштою по Україні.">
  <meta name="theme-color" content="#faf8f5">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <!-- installable app (PWA); the admin panel installs as a separate «AMINA Admin» -->
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/icon-apple.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="AMINA">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <script>
    if (location.pathname.indexOf('/admin') === 0) {
      document.querySelector('link[rel=manifest]').href = '/admin.webmanifest';
      document.querySelector('link[rel=apple-touch-icon]').href = '/icons/admin-apple.png';
      document.querySelector('meta[name=apple-mobile-web-app-title]').content = 'AMINA Admin';
    }
    // Chrome offers installation once; keep the offer for our own «Встановити» button
    addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      window.__installPrompt = e;
      dispatchEvent(new Event('amina:installable'));
    });
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <app-root></app-root>
</body>
</html>
